[project]
name = "ocrbench"
version = "0.1.0"
description = "Benchmark a self-hosted OCR model (vLLM on SageMaker) against hosted LLMs on synthetic documents with ground truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# Document generation + local tooling (not needed inside the bench runner image).
dev = [
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ocrbench = "ocrbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrbench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
