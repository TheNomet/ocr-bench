# Lint, type check, tests, Terraform validation, workflow lint, a secret scan and the denylist guard on every push and pull request.
# Actions are pinned by commit SHA (the exact tag is in the comment); Dependabot keeps them current.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: ruff
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: pyright
        run: uv run pyright
      - name: pytest
        run: uv run pytest -q

  # The headless-Chrome rendering test (excluded from the default run): Chrome comes with the runner image.
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs (no-op where unset)
      - name: allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The test is skipped when no Chrome is found; here that must be an error, not a silent pass
      - name: Chrome present
        run: uv run python -c "from ocrbench.docgen.render import find_chrome as f; c = f(); assert c, 'no Chrome found'; print(c)"
      - name: pytest -m chrome
        shell: bash
        run: |
          uv run pytest -m chrome -rs | tee pytest.out
          if grep -q SKIPPED pytest.out; then echo "::error::chrome tests were skipped"; exit 1; fi

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8 # same as scripts/get_tools.sh
          terraform_wrapper: false
      - name: provider cache dir
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/.terraform.lock.hcl') }}
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64 tarball
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: actionlint
        run: |
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The denylist guard (scripts/public_guard.sh) also runs here, so web edits and squash merges, which
  # skip the local hooks, are scanned too. The denylist comes from the PUBLIC_DENYLIST secret; without it
  # (forks, Dependabot, first setup) the job warns and passes. The guard prints only locations.
  public-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the range scan needs the pushed commits and their parents
          persist-credentials: false
      - name: denylist scan
        shell: bash
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_DENYLIST" ]; then
            echo "::warning title=public guard skipped::The PUBLIC_DENYLIST secret is not set (or not available to this run), so the denylist scan did not run."
            exit 0
          fi
          umask 077
          deny="$RUNNER_TEMP/public-denylist"
          trap 'rm -f "$deny"' EXIT
          printf '%s\n' "$PUBLIC_DENYLIST" >"$deny"
          export PUBLIC_GUARD_DENYLIST="$deny"
          unset PUBLIC_DENYLIST PUBLIC_GUARD_ALLOW_MISSING
          have() { [ -n "$1" ] && [ "${1//0/}" != "" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          scripts/public_guard.sh tree
          case "$EVENT" in
            push)
              if have "$BEFORE"; then
                scripts/public_guard.sh range "$BEFORE..$GITHUB_SHA"
              else
                # new branch (all-zero before) or force-push (old tip not fetched): scan all history
                scripts/public_guard.sh range "$GITHUB_SHA"
              fi
              ;;
            pull_request)
              if have "$PR_BASE" && have "$PR_HEAD"; then
                scripts/public_guard.sh range "$PR_BASE..$PR_HEAD"
              else
                scripts/public_guard.sh range "$GITHUB_SHA"
              fi
              ;;
            *) scripts/public_guard.sh range "$GITHUB_SHA" ;;
          esac
