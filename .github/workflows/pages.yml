# Deploys the already-built static site from the `gh-pages` branch to GitHub Pages.
# The site is built and checked locally by `just publish` (it needs the local runs and config);
# this workflow only ships it. Run it from main: `gh workflow run pages.yml`.
name: pages

on:
  workflow_dispatch:

permissions: {}

# Never cancel a deployment half-way; a newer run waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out gh-pages
      pages: write # deploy to Pages
      id-token: write # OIDC token deploy-pages uses to prove the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
