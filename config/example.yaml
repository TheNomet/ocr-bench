# ocr-bench configuration — the single source of truth for the CLI and Terraform.
#
# Copy to config/<name>.yaml (gitignored) and select it with `CONFIG=config/<name>.yaml`
# (justfile) or `ocrbench --config config/<name>.yaml ...`. Values may reference
# environment variables as ${VAR} or ${VAR:-default}.
#
# Every block is documented in docs/configuration.md.

# Short name used as the prefix for every AWS resource (S3 bucket, ECR repos, IAM roles...).
# Must be globally unique enough for the S3 bucket name: <name_prefix>-artifacts.
name_prefix: ocrbench-dev

aws:
  profile: default            # AWS CLI/SDK profile used by the CLI and Terraform
  account_id: "123456789012"  # Terraform refuses to run against any other account
  region: eu-west-1
  # Optional IAM permissions boundary applied to every role the stack creates
  # (some landing zones require one). null = none.
  permissions_boundary_arn: null
  # Tags added to every resource.
  tags:
    Project: ocr-bench
    Temporary: "true"

# Terraform remote state. null bucket = local state file in .state/<name_prefix>/terraform.tfstate.
terraform_state:
  bucket: null                # e.g. my-tf-state-bucket
  key: ocr-bench/terraform.tfstate
  dynamodb_table: null        # optional lock table

network:
  # existing: use an existing VPC + private subnets (they need a route to S3,
  #           ECR, CloudWatch Logs, SageMaker runtime and your LLM endpoints).
  # create:   create a small VPC with 2 private subnets, a NAT gateway and an S3 endpoint.
  #           The NAT gateway bills while the stack exists (~$32/month idle); `just destroy` removes it.
  mode: create
  existing:
    vpc_id: null              # or set vpc_name_tag
    vpc_name_tag: null
    subnet_ids: []            # or set subnet_name_tag_glob
    subnet_name_tag_glob: null
  create:
    cidr: 10.42.0.0/24

ecs:
  # create: a dedicated Fargate cluster for the bench runner; otherwise the name of an existing cluster.
  cluster: create

# ---------------------------------------------------------------------------
# Backends: everything that reads pages or extracts fields. The key is the name used in every
# record, table and pipeline, so pick a neutral model name (e.g. sonnet-4.5, unlimited-ocr).
#   kind: selfhosted         a vLLM-served model on its own SageMaker endpoint (<name_prefix>-<key>)
#                            or at direct_url; any number of them. Key: [a-z0-9-], it names AWS resources.
#   kind: bedrock            AWS Bedrock (Converse API)
#   kind: openai_compatible  any /v1/chat/completions endpoint (gateway, proxy, OpenAI, vLLM...)
# Optional on every backend:
#   label: "My Model 1.0"    display name (default: derived from the model id)
#   postprocess: [..]        steps applied to its output before scoring/extraction:
#                            strip_grounding | strip_think | unwrap_code_fence | doctags_to_text
# ---------------------------------------------------------------------------
backends:
  unlimited-ocr:
    kind: selfhosted
    hf_repo: baidu/Unlimited-OCR
    hf_revision: 07dea832e22aefee32ad281d4b80551282e1c168   # full commit hash (weights are hash-verified)
    hf_skip_prefixes: ["assets/", "wheel/", "Unlimited-OCR.pdf", ".gitattributes"]
    # Pin by digest for reproducible builds (a tag works, but the build prints the digest to pin):
    source_image: docker.io/vllm/vllm-openai:unlimited-ocr
    image_platform: linux/amd64   # platform crane mirrors from source_image (SageMaker GPU hosts are amd64)
    served_model_name: baidu/Unlimited-OCR
    # Extra `vllm serve` arguments (model path, host and port are added automatically).
    serve_args:
      - --trust-remote-code
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --max-num-seqs
      - "64"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.90"
    # Per-request body (OpenAI chat format). The page image is appended as an image_url part.
    # Replaces bench.prompts.transcribe for this backend.
    request:
      prompt: "<image>document parsing."
      max_tokens: 8192
      temperature: 0.0
      extra_body:
        skip_special_tokens: false
        vllm_xargs: {ngram_size: 35, window_size: 128}
    # DeepSeek-OCR-style output: unwrap <|ref|>, drop <|det|> boxes before scoring.
    postprocess: [strip_grounding]
    sagemaker:
      # Tried in priority order (GPU capacity is often scarce; one type alone may fail).
      instance_pools: [ml.g6.xlarge, ml.g6e.xlarge, ml.g5.xlarge, ml.g5.2xlarge]
      inference_ami_version: al2023-ami-sagemaker-inference-gpu-4-1   # NVIDIA driver for CUDA 13 images
      container_startup_timeout_s: 1800   # health-check timeout while vLLM loads the model
      model_download_timeout_s: 1800      # time allowed to copy the weights from S3 to the host
      wait_timeout_s: 5400                # `endpoint up/wait` give up (non-zero) if not InService by then
      network_isolation: true
      response_stream: false              # true: stream answers (8 min limit instead of 60 s per request)
      # The endpoint deletes itself after this many hours (EventBridge Scheduler), in case nobody runs
      # `endpoint down`. 0 = never. With > 0, `endpoint up` refuses to start if it can't schedule that.
      max_lifetime_hours: 8
      # price_per_hour_usd: null    # default: looked up in the AWS Pricing API for the instance actually used
    # Optional: talk to an already-running vLLM server instead of SageMaker (local GPU, tunnel...).
    direct_url: null            # e.g. http://localhost:8000

  # A second self-hosted model: IBM's Granite-Docling (Apache 2.0, 258M), the VLM of the Docling library.
  # It answers in DocTags; `doctags_to_text` turns that into plain text. Uncomment to use it.
  # granite-docling:
  #   kind: selfhosted
  #   hf_repo: ibm-granite/granite-docling-258M
  #   hf_revision: 55d41aa24c0be047c7e4ed89b51058ea586b0428   # the `untied` branch, which vLLM needs
  #   hf_skip_prefixes: ["granite_docling.png", ".gitattributes"]
  #   source_image: docker.io/vllm/vllm-openai:latest         # pin by digest
  #   served_model_name: ibm-granite/granite-docling-258M
  #   serve_args: [--max-model-len, "8192", --max-num-seqs, "64", --gpu-memory-utilization, "0.90"]
  #   request:
  #     prompt: "Convert this page to docling."
  #     image_first: true          # page image before the prompt, as Docling sends it
  #     max_tokens: 7000           # 8192 context minus ~1k image tokens
  #     temperature: 0.0
  #     extra_body: {skip_special_tokens: false}   # keep the DocTags
  #   postprocess: [doctags_to_text]
  #   sagemaker: {instance_pools: [ml.g6.xlarge, ml.g5.xlarge], max_lifetime_hours: 6}

  sonnet-4.5:
    kind: bedrock
    # temperature: 1               # optional override; some models accept only 1. null = don't send
    # (reasoning_effort is openai_compatible only; on a bedrock backend the config is rejected)
    # Claude 4.5 on Bedrock is invoked through an inference profile: eu. / us. / apac. / global. + model id,
    # matching the region below. A bare foundation-model id is rejected for these models.
    model_id: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
    region: ${AWS_REGION:-eu-west-1}
    price_per_mtok: {input: 3.0, output: 15.0}            # USD, for the cost table only
  haiku-4.5:
    kind: bedrock
    model_id: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    region: ${AWS_REGION:-eu-west-1}
    price_per_mtok: {input: 1.0, output: 5.0}
  # gateway-sonnet:
  #   kind: openai_compatible
  #   base_url: https://llm-gateway.example.internal       # /v1/chat/completions is appended
  #   model: anthropic.claude-sonnet-4-5-20250929-v1:0
  #   ca_bundle: null            # extra PEM to trust (corporate TLS), path on the runner
  #   cache_bust: true           # add a per-request nonce: some gateways cache identical requests
  #   reasoning_effort: medium   # optional: low | medium | high, for models with extended thinking
  #   price_per_mtok: {input: 3.0, output: 15.0}
  #   headers: {}                # extra static headers
  #   auth:
  #     type: none | bearer_env | oauth2_kms_jwt
  #     # bearer_env:      env: MY_TOKEN_VAR
  #     # oauth2_kms_jwt:  client-credentials with a private_key_jwt assertion signed by AWS KMS
  #     token_url: https://idp.example.com/oauth2/token
  #     audience: null             # JWT "aud" claim; defaults to token_url
  #     client_id: 00000000-0000-0000-0000-000000000000
  #     kms_key_id: 00000000-0000-0000-0000-000000000000    # ECC_NIST_P256 SIGN_VERIFY key
  #     kms_region: eu-west-1
  #     scope: llm.chat:write

# ---------------------------------------------------------------------------
# Benchmark
# ---------------------------------------------------------------------------
bench:
  docs:
    per_type: 6            # documents per type (8 types) -> 48 docs, 54 pages, 108 page images (clean + degraded)
    seed: 7
    scale: 2.0             # pdfium render scale (2.0 ~ 144 dpi, A4 ~ 1190x1684 px)
  # Stage 2 — an LLM agent extracts the per-type fields.
  extraction:
    agent: sonnet-4.5                     # backend that does the extraction
    # Pipelines to score. "<transcriber>->agent" extracts from that transcriber's text;
    # "image->agent" sends the page images straight to the agent (one step).
    # Don't use "<X>->agent" when X is the agent's own model: it only measures the model against itself
    # (such pipelines are hidden in reports).
    pipelines: ["unlimited-ocr->agent", "haiku-4.5->agent", "image->agent"]
    # Optional per-plan override. "<input>-><backend>" makes that backend the extractor instead of `agent`:
    plan_pipelines:
      # compare: ["image->agent", "image->haiku-4.5"]
      variation: ["image->sonnet-4.5", "image->haiku-4.5", "haiku-4.5->sonnet-4.5"]
    # Optional per-plan: extract every document N times (default 1), to measure run-to-run variation.
    # Each repeat is scored on its own (scores.json `variation`); the main tables score the last one.
    # A "<transcriber>->X" pipeline re-reads the same transcript in every repeat (it measures X alone).
    plan_repeat:
      variation: 3
    concurrency: 8
  # Stage 4: an LLM reads the computed key facts and writes the recommendation (runs/<id>/summary.md).
  summary:
    agent: sonnet-4.5                     # backend; defaults to the extraction agent
  # Optional: override any prompt or output-token limit (defaults in src/ocrbench/prompts.py). The values
  # used are recorded in each run's run.json.
  # prompts:
  #   transcribe: {system: "...", user: "...", max_tokens: 8192}
  #   extract:    {system: "...", rules: "...", max_tokens: 2048}
  #   summarize:  {system: "...", max_tokens: 12000, temperature: 0.2}
  # Optional: backends a plan re-runs only to check reproducibility. Hidden on that run's page and in
  # its recommendation, still in the data and in Compare runs.
  # plan_report:
  #   repeat: {hide_backends: [haiku-4.5]}
  # One-line description per plan, shown on every run of it (the run id is <date>-<plan>).
  plan_descriptions:
    smoke: "Quick health check: a couple of pages per backend."
    bedrock-only: "No GPU: Claude Sonnet 4.5 and Haiku 4.5 on Bedrock, transcribing vs reading the images."
    suite: "Self-hosted OCR vs hosted LLMs, single requests and batch load."
    variation: "Run-to-run variation: the same pages and documents 3 times with identical settings, to tell real differences from sampling noise."
  # Named run plans: each item is one transcription run.
  # Pipelines whose transcriber a plan doesn't run are skipped for that plan.
  # Item fields: backend, concurrency, and optionally variant (clean | degraded | both, default both),
  # limit (N page images, spread over the types; 0 = all), repeat (send every page N times, default 1),
  # warmup (one untimed request first, default true). See docs/configuration.md.
  plans:
    # No GPU, no deploy: with runner.mode local this needs only Bedrock access (see README).
    bedrock-only:
      - {backend: sonnet-4.5, concurrency: 4}
      - {backend: haiku-4.5, concurrency: 4}
    smoke:
      - {backend: unlimited-ocr, concurrency: 1, limit: 2, variant: clean}
      - {backend: sonnet-4.5, concurrency: 1, limit: 1, variant: clean}
    suite:
      - {backend: unlimited-ocr, concurrency: 1}
      - {backend: sonnet-4.5, concurrency: 1}
      - {backend: haiku-4.5, concurrency: 1}
      - {backend: unlimited-ocr, concurrency: 4}
      - {backend: unlimited-ocr, concurrency: 16}
      - {backend: unlimited-ocr, concurrency: 32}
      - {backend: sonnet-4.5, concurrency: 16}
      - {backend: haiku-4.5, concurrency: 16}
    # Run-to-run variation (with bench.extraction.plan_repeat.variation): every page 3 times at concurrency 1.
    # Most useful for models that accept only temperature 1 (e.g. Claude 5.5 through some gateways: put
    # those backends here instead); at temperature 0 it checks how deterministic a model really is.
    # Concurrency 1 only: sampling noise doesn't depend on concurrency, more levels would only add cost.
    variation:
      - {backend: sonnet-4.5, concurrency: 1, repeat: 3}
      - {backend: haiku-4.5, concurrency: 1, repeat: 3}
  max_retries: 4

# Where the bench runs: "fargate" (inside the VPC — needed when endpoints are private)
# or "local" (this machine; needs network access to every backend).
runner:
  mode: fargate
  cpu: 2048
  memory: 4096
  max_minutes: 240          # hard limit per bench task (it stops itself); > 0
  stop_grace_seconds: 120   # after that limit (SIGTERM), time to sync partial results before SIGKILL
  # cpu, memory, max_minutes and stop_grace_seconds are fixed in the task definition: re-run `just deploy`
  # after changing them (`ocrbench run` refuses until then).
  assign_public_ip: false   # Fargate task gets a public IP (only for public subnets without a NAT)
  # Bench image = this base + a layer with the ocrbench package and its wheels (built with crane).
  base_image: docker.io/library/python:3.12-slim
  # Optional PEM bundle baked into the bench image and trusted for outbound TLS.
  extra_ca_pem: null        # e.g. ~/certs/corp-root.pem

# How long the stack keeps things (applied by Terraform: re-run `just deploy` after a change).
retention:
  runs_days: 60             # run copies under s3://<bucket>/runs/ expire after this; 0 = never (weights never expire)
  log_days: 14              # bench task + endpoint logs in CloudWatch; one of 1, 3, 5, 7, 14, 30, 60, 90, ... 3653
  ecr_untagged_days: 14     # images a rebuild left untagged expire after this
  ecr_keep_mirrors: 2       # newest source-image mirrors kept in the <name_prefix>-vllm repo
